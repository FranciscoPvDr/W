<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario TI - Detalle</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080a0e;--panel:#0d1117;--panel2:#131920;--panel-glass:rgba(13,17,23,0.7);--border:rgba(99,179,237,.08);--border2:rgba(99,179,237,.18);--text:#cdd9e5;--text2:#768390;--text3:#3d4852;--green:#3fb950;--green-bg:#0a2416;--green-t:#56d364;--red:#f85149;--red-bg:#2a0a0a;--red-t:#ff7b72;--blue:#388bfd;--blue-bg:#031d3a;--blue-t:#79c0ff;--cyan:#39c5cf;--purple:#a371f7;--amber:#d29922;--amber-bg:#2a2012;--amber-t:#f2cc60;--accent:#388bfd;--shadow-sm:0 4px 16px rgba(0,0,0,0.2);--shadow-lg:0 12px 48px rgba(0,0,0,0.4)}
    *{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(56,139,253,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(56,139,253,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}body:after{content:'';position:fixed;top:0;left:0;right:0;height:300px;background:radial-gradient(ellipse 80% 200px at 50% -50px,rgba(56,139,253,.1),transparent);pointer-events:none;z-index:0}header{padding:0 2.5rem;min-height:80px;border-bottom:1px solid rgba(56,139,253,0.15);display:flex;align-items:center;justify-content:space-between;gap:3rem;position:sticky;top:0;background:rgba(6,8,17,0.85);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);z-index:100;box-shadow:0 1px 0 0 rgba(99,179,237,0.12),0 20px 60px rgba(0,0,0,0.5),inset 0 1px 0 0 rgba(255,255,255,0.05)}header > *,.card > *{position:relative;z-index:1}.logo{font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-t)}.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn,.nav a,.nav button{border:1px solid rgba(99,179,237,.2);background:rgba(13,17,23,0.6);backdrop-filter:blur(10px);color:var(--text);padding:9px 16px;border-radius:8px;text-decoration:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;transition:all .3s}.btn:hover,.nav a:hover,.nav button:hover{background:rgba(56,139,253,0.15);border-color:rgba(56,139,253,.35);box-shadow:0 4px 16px rgba(56,139,253,.25);transform:translateY(-2px)}.primary{background:rgba(10,36,22,0.8)!important;border-color:rgba(63,185,80,.35)!important;color:var(--green-t)!important}
    main{position:relative;z-index:1;padding:28px 2.5rem 42px;max-width:1440px;margin:0 auto}.card{background:rgba(13,17,23,0.75);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(99,179,237,.12);border-radius:16px;padding:24px;box-shadow:0 12px 48px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.03),inset 0 1px 0 0 rgba(255,255,255,.06);position:relative;overflow:hidden}.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(56,139,253,.5) 30%,rgba(163,113,247,.4) 70%,transparent);opacity:.8;pointer-events:none}.card h2,.section-title{font-family:'Space Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px;color:var(--blue-t)}.muted{color:var(--text2)}.hero{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin-bottom:18px}.asset-icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,rgba(3,29,58,.9),rgba(57,197,207,.12));border:1px solid rgba(99,179,237,.22);display:grid;place-items:center;font-size:1.8rem;box-shadow:0 8px 28px rgba(56,139,253,.18)}h1{font-family:'Space Mono',monospace;font-size:1.8rem;letter-spacing:.04em;text-transform:uppercase}.subtitle{margin-top:4px;color:var(--text2)}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.badge{display:inline-block;padding:6px 12px;border-radius:999px;font-family:'Space Mono',monospace;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(99,179,237,.25)}.badge-activo{background:rgba(10,36,22,.65);border-color:rgba(63,185,80,.4);color:var(--green-t)}.badge-disponible{background:rgba(3,29,58,.8);border-color:rgba(56,139,253,.4);color:var(--blue-t)}.badge-reparacion{background:rgba(42,32,10,.65);border-color:rgba(210,153,34,.4);color:var(--amber-t)}.badge-fuera{background:rgba(61,33,8,.7);border-color:rgba(245,128,37,.45);color:#ffa657}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.summary-card{background:rgba(19,25,32,.7);border:1px solid rgba(99,179,237,.12);border-radius:14px;padding:16px}.label{display:block;color:var(--text3);font-family:'Space Mono',monospace;font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}.value{font-size:1rem;color:var(--text);overflow-wrap:anywhere}.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}.data-list{display:grid;gap:12px}.data-row{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}.complementos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.comp-card{background:var(--panel2);border:1px solid rgba(99,179,237,.12);border-radius:14px;padding:14px}.comp-title{font-family:'Space Mono',monospace;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}.comp-lines{display:grid;gap:4px;color:var(--text2);font-size:.88rem}.agent-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.empty{padding:18px;border:1px dashed rgba(99,179,237,.2);border-radius:14px;color:var(--text2);text-align:center}.error{color:var(--red-t)}@media(max-width:1100px){header{height:auto;padding:12px 1rem;align-items:flex-start;flex-direction:column}main{padding:1rem}.summary-grid,.agent-grid{grid-template-columns:repeat(2,1fr)}.two-cols{grid-template-columns:1fr}.hero{grid-template-columns:auto 1fr}.hero-actions{grid-column:1/-1;justify-content:flex-start}}@media(max-width:620px){.summary-grid,.agent-grid,.complementos{grid-template-columns:1fr}.data-row{grid-template-columns:1fr}.nav a,.nav button,.btn{width:100%;text-align:center}.nav{width:100%}h1{font-size:1.35rem}}
  </style>
</head>
<body>
<header>
  <div class="logo">Monitor · Detalle</div>
  <nav class="nav"><a href="/equipos">← Regresar</a><button onclick="logout()"><i class="fas fa-right-from-bracket"></i> Salir</button></nav>
</header>
<main>
  <section class="card" id="detailCard">
    <div class="muted">Cargando asset...</div>
  </section>
</main>
<script src="/equipo-detalle.js"></script>
<script src="/auth-session.js"></script>
</body>
</html>
