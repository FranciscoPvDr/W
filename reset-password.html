<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambiar contraseña</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#f0f6fc;font-family:Inter,Segoe UI,Arial}.card{width:min(430px,92vw);background:#161b22;border:1px solid #30363d;border-radius:20px;padding:28px}input,button{width:100%;padding:13px;border-radius:12px;margin:8px 0}input{background:#0d1117;border:1px solid #30363d;color:#fff}button{border:0;background:#238636;color:#fff;font-weight:800;cursor:pointer}a{color:#58a6ff}</style></head><body><div class="card"><h1>Cambiar contraseña</h1><input id="actual" type="password" placeholder="contraseña actual"><input id="nueva" type="password" placeholder="contraseña nueva"><button onclick="cambiar()">Actualizar</button><p id="msg"></p><a href="/dashboard">Volver</a></div><script>const SERVER=location.origin,TOKEN=localStorage.getItem('monitor_token');if(!TOKEN)location.href='/login';async function cambiar(){const res=await fetch(`${SERVER}/api/usuarios/cambiar-password`,{method:'POST',headers:{Authorization:`Bearer ${TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({password_actual:actual.value,password_nueva:nueva.value})});const data=await res.json().catch(()=>({}));msg.textContent=res.ok?'Contraseña actualizada':(data.detail||'Error')}</script></body></html>
