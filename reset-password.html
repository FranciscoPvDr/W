<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña</title>
  <style>
    :root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#f0f6fc;--muted:#8b949e;--green:#238636;--red:#f85149}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#1f2937,#0d1117 55%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.card{width:min(430px,92vw);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px;box-shadow:0 22px 70px rgba(0,0,0,.35)}h1{margin:0 0 8px}.muted{color:var(--muted);font-size:.9rem;margin-bottom:20px}label{display:block;margin:12px 0 6px;color:var(--muted);font-size:.8rem;font-weight:700;text-transform:uppercase}input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0d1117;color:var(--text)}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--green);color:white;font-weight:800;cursor:pointer}.msg{margin-top:14px;color:var(--muted)}.err{color:#ffb4ae}.ok{color:#7ee787}a{color:#58a6ff}
  </style>
</head>
<body>
  <div class="card">
    <h1>Restablecer contraseña</h1>
    <div class="muted">Este cambio actualiza la contraseña de la web y de la app.</div>
    <label>Nueva contraseña</label>
    <input id="password" type="password" autocomplete="new-password" />
    <label>Confirmar contraseña</label>
    <input id="confirm" type="password" autocomplete="new-password" />
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:.9rem">
      <input id="showPasswords" type="checkbox" style="width:auto" onchange="togglePasswords()" />
      Mostrar contraseñas
    </label>
    <div id="matchInfo" class="muted"></div>
    <button onclick="resetPassword()">Actualizar contraseña</button>
    <div id="msg" class="msg"></div>
    <div class="muted" style="margin-top:18px"><a href="/login">Volver al login</a></div>
  </div>
<script>
const SERVER=window.location.origin;
const token=new URLSearchParams(location.search).get('token')||'';
const passwordInput=document.getElementById('password');
const confirmInput=document.getElementById('confirm');
const showPasswordsInput=document.getElementById('showPasswords');
const msgBox=document.getElementById('msg');
const matchInfoBox=document.getElementById('matchInfo');
if(!token) msgBox.innerHTML='<span class="err">Link inválido. Solicita uno nuevo al administrador.</span>';
function togglePasswords(){
  const type=showPasswordsInput.checked?'text':'password';
  passwordInput.type=type;
  confirmInput.type=type;
}
function cleanPassword(value){
  return (value || '').normalize('NFC').trim();
}
function updateMatchInfo(){
  const p=cleanPassword(passwordInput.value);
  const c=cleanPassword(confirmInput.value);
  matchInfoBox.textContent=`Nueva: ${p.length} caracteres · Confirmar: ${c.length} caracteres`;
  matchInfoBox.className=p&&c&&p===c?'msg ok':'muted';
}
passwordInput.addEventListener('input',updateMatchInfo);
confirmInput.addEventListener('input',updateMatchInfo);
async function resetPassword(){
  const p=cleanPassword(passwordInput.value); const c=cleanPassword(confirmInput.value);
  if(!token){msgBox.innerHTML='<span class="err">Link inválido.</span>';return}
  if(!p||p.length<6){msgBox.innerHTML='<span class="err">La contraseña debe tener al menos 6 caracteres.</span>';return}
  if(p!==c){msgBox.innerHTML='<span class="err">Las contraseñas no coinciden.</span>';return}
  const res=await fetch(`${SERVER}/api/password-reset/confirm`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password_nueva:p})});
  const data=await res.json().catch(()=>({}));
  msgBox.innerHTML=res.ok?'<span class="ok">Contraseña actualizada. Ya puedes entrar en web y app.</span>':`<span class="err">${data.detail||'No se pudo actualizar'}</span>`;
  if(res.ok){localStorage.clear();passwordInput.value=confirmInput.value=''}
}
</script>
</body>
</html>
