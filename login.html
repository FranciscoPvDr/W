<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Monitor de Equipos</title>
  <style>
    :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#f0f6fc; --muted:#8b949e; --accent:#58a6ff; --danger:#f85149; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at top,#1f2937,#0d1117 55%); color:var(--text); font-family:Inter,Segoe UI,Arial,sans-serif; }
    .wrap { width:min(420px,92vw); }
    .brand { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:22px; }
    .brand-icon { width:46px; height:46px; border-radius:16px; display:grid; place-items:center; background:linear-gradient(135deg,#238636,#58a6ff); box-shadow:0 20px 50px rgba(88,166,255,.25); }
    h1 { margin:0; font-size:1.35rem; letter-spacing:.02em; }
    .card { padding:28px; border:1px solid var(--border); border-radius:22px; background:rgba(22,27,34,.86); box-shadow:0 22px 70px rgba(0,0,0,.35); backdrop-filter:blur(14px); }
    label { display:block; margin:0 0 8px; color:var(--muted); font-size:.8rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
    input { width:100%; margin-bottom:16px; padding:13px 14px; border:1px solid var(--border); border-radius:12px; background:#0d1117; color:var(--text); outline:none; font-size:1rem; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(88,166,255,.14); }
    button { width:100%; margin-top:4px; padding:13px 16px; border:0; border-radius:12px; background:linear-gradient(135deg,#238636,#2ea043); color:white; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.65; cursor:not-allowed; }
    .error { display:none; margin:0 0 14px; padding:10px 12px; border:1px solid rgba(248,81,73,.35); border-radius:12px; color:#ffb4ae; background:rgba(248,81,73,.12); font-size:.9rem; }
    .hint { margin-top:16px; color:var(--muted); text-align:center; font-size:.82rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-icon">🖥</div>
      <h1>Monitor de Equipos</h1>
    </div>
    <div class="card">
      <label for="login-user">Usuario</label>
      <input type="text" id="login-user" placeholder="admin" autocomplete="username" autofocus />
      <label for="login-pass">Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" />
      <div class="error" id="login-error">Usuario o contraseña incorrectos</div>
      <button id="login-btn" onclick="doLogin()">Iniciar sesión</button>
    </div>
    <div class="hint">La sesión se mantiene aunque actualices la página.</div>
  </div>

  <script>
    const RENDER_URL = "https://TU-URL-DE-RENDER.onrender.com";
    const SERVER = (window.location.origin === 'null' || window.location.protocol === 'file:')
      ? RENDER_URL : window.location.origin;

    const existingToken = localStorage.getItem('monitor_token');
    if (existingToken) window.location.href = '/dashboard';

    document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value;
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      errEl.style.display = 'none';
      btn.disabled = true;
      const form = new URLSearchParams();
      form.append('username', user);
      form.append('password', pass);
      try {
        const res = await fetch(`${SERVER}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: form
        });
        if (!res.ok) { errEl.style.display = 'block'; return; }
        const data = await res.json();
        localStorage.setItem('monitor_token', data.access_token);
        localStorage.setItem('monitor_role', data.role || 'ingeniero');
        localStorage.setItem('monitor_nombre', data.nombre || user);
        localStorage.setItem('monitor_username', user);
        window.location.href = '/dashboard';
      } catch {
        errEl.textContent = 'No se pudo conectar al servidor';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
