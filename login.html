<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#f0f6fc;font-family:Inter,Segoe UI,Arial}.card{width:min(420px,92vw);background:#161b22;border:1px solid #30363d;border-radius:20px;padding:28px}input,button{width:100%;padding:13px;border-radius:12px;margin:8px 0}input{background:#0d1117;border:1px solid #30363d;color:#fff}button{border:0;background:#238636;color:#fff;font-weight:800;cursor:pointer}.err{display:none;color:#ffb4ae}</style></head><body><div class="card"><h1>Monitor de Equipos</h1><input id="user" placeholder="usuario" autofocus><input id="pass" type="password" placeholder="contraseña"><p class="err" id="err">Usuario o contraseña incorrectos</p><button onclick="login()">Entrar</button></div><script>const SERVER=location.origin;if(localStorage.getItem('monitor_token'))location.href='/dashboard';pass.addEventListener('keydown',e=>{if(e.key==='Enter')login()});async function login(){err.style.display='none';const form=new URLSearchParams();form.append('username',user.value.trim());form.append('password',pass.value);try{const res=await fetch(`${SERVER}/api/login`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:form});if(!res.ok){err.style.display='block';return}const data=await res.json();localStorage.setItem('monitor_token',data.access_token);localStorage.setItem('monitor_role',data.role||'ingeniero');localStorage.setItem('monitor_nombre',data.nombre||user.value);localStorage.setItem('monitor_username',data.username||user.value);location.href=data.role==='guardia'?'/guardia':'/dashboard'}catch{err.textContent='No se pudo conectar';err.style.display='block'}}</script></body></html>
