<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitor de Equipos - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a0e;--panel:#0d1117;--panel2:#131920;--border:rgba(99,179,237,.08);--border2:rgba(99,179,237,.18);--text:#cdd9e5;--text2:#768390;--text3:#3d4852;--green:#3fb950;--green-bg:#0a2416;--green-t:#56d364;--red:#f85149;--red-bg:#2a0a0a;--red-t:#ff7b72;--blue:#388bfd;--blue-bg:#031d3a;--blue-t:#79c0ff;--cyan:#39c5cf;--accent:#388bfd}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(56,139,253,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(56,139,253,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}body:after{content:'';position:fixed;top:0;left:0;right:0;height:300px;background:radial-gradient(ellipse 80% 200px at 50% -50px,rgba(56,139,253,.1),transparent);pointer-events:none;z-index:0}.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding:1rem}.auth-wrap{width:100%;max-width:430px}.auth-brand{text-align:center;margin-bottom:2.2rem}.auth-brand-icon{width:52px;height:52px;background:linear-gradient(135deg,#0d2040,#0d1117);border:1px solid var(--border2);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.5rem;box-shadow:0 0 20px rgba(56,139,253,.15)}.auth-brand h1{font-family:'Space Mono',monospace;font-size:.78rem;letter-spacing:.2em;color:var(--text2);text-transform:uppercase}.card{background:var(--panel);border:1px solid var(--border2);border-radius:16px;padding:2rem;box-shadow:0 0 0 1px rgba(56,139,253,.04),0 24px 48px rgba(0,0,0,.5);position:relative;overflow:hidden}.card:before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(56,139,253,.5),transparent)}label{display:block;font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;margin:1.2rem 0 6px}input{width:100%;background:var(--panel2);border:1px solid var(--border2);border-radius:8px;padding:11px 14px;font-family:'Space Mono',monospace;font-size:.82rem;color:var(--text);outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,139,253,.1)}button,.btn{width:100%;margin-top:1.4rem;padding:12px;border-radius:8px;border:0;background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s}button:hover,.btn:hover{background:#4d9fff;transform:translateY(-1px);box-shadow:0 6px 20px rgba(56,139,253,.3)}.err,#msg{margin-top:1rem;color:var(--red-t);font-size:.82rem}.err{display:none}.back-link{display:inline-block;margin-top:1rem;color:var(--blue-t);text-decoration:none;font-size:.86rem}.back-link:hover{text-decoration:underline}
</style>
</head>
<body><div class="auth-screen"><div class="auth-wrap"><div class="auth-brand"><div class="auth-brand-icon">PC</div><h1>Monitor de Equipos</h1></div><div class="card"><label>Usuario</label><input id="user" placeholder="usuario" autofocus autocomplete="username"><label>Contrasena</label><input id="pass" type="password" placeholder="contrasena" autocomplete="current-password"><p class="err" id="err">Usuario o contrasena incorrectos</p><button onclick="login()">Entrar</button></div></div></div><script>const SERVER=location.origin;if(localStorage.getItem('monitor_token'))location.href='/dashboard';pass.addEventListener('keydown',e=>{if(e.key==='Enter')login()});async function login(){err.style.display='none';const form=new URLSearchParams();form.append('username',user.value.trim());form.append('password',pass.value);try{const res=await fetch(`${SERVER}/api/login`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:form});if(!res.ok){err.style.display='block';return}const data=await res.json();localStorage.setItem('monitor_token',data.access_token);localStorage.setItem('monitor_role',data.role||'ingeniero');localStorage.setItem('monitor_nombre',data.nombre||user.value);localStorage.setItem('monitor_username',data.username||user.value);location.href=data.role==='guardia'?'/guardia':'/dashboard'}catch{err.textContent='No se pudo conectar';err.style.display='block'}}</script></body>
</html>
