<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuarios</title><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#f0f6fc;--muted:#8b949e;--blue:#58a6ff;--green:#238636;--red:#da3633}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial}header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--border);background:#010409}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a,.nav button,.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 12px;border-radius:10px;text-decoration:none;cursor:pointer}.active{border-color:var(--blue)!important}main{padding:24px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}label{display:block;margin:10px 0 5px;color:var(--muted);font-size:.75rem;font-weight:700;text-transform:uppercase}input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:#0d1117;color:var(--text)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left}.primary{background:var(--green)!important}.danger{background:var(--red)!important}.badge{padding:4px 8px;border-radius:999px;background:#1f6feb33;color:#79c0ff}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>Usuarios</strong><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/equipos">Equipos</a><a class="active" href="/usuarios">Usuarios</a><button onclick="logout()">Salir</button></nav></header><main><div class="grid"><section class="card"><h2>Crear usuario</h2><label>Usuario</label><input id="username"><label>Nombre</label><input id="nombre"><label>Contraseña temporal</label><input id="password" type="password"><label>Rol</label><select id="role"><option value="guardia">Guardia</option><option value="ingeniero">Ingeniero</option><option value="super_admin">Super Admin</option></select><button class="btn primary" onclick="crearUsuario()">Crear usuario</button><p id="msg"></p></section><section class="card"><h2>Usuarios activos</h2><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Acciones</th></tr></thead><tbody id="tbody"></tbody></table></section></div></main><script>const SERVER=location.origin,TOKEN=localStorage.getItem('monitor_token'),ROLE=localStorage.getItem('monitor_role');if(!TOKEN)location.href='/login';if(ROLE!=='super_admin')location.href='/dashboard';function headers(){return{Authorization:`Bearer ${TOKEN}`}}function jsonHeaders(){return{...headers(),'Content-Type':'application/json'}}function logout(){localStorage.clear();location.href='/login'}function roleLabel(r){return r==='super_admin'?'Super Admin':r==='guardia'?'Guardia':'Ingeniero'}async function cargar(){const res=await fetch(`${SERVER}/api/usuarios`,{headers:headers()});if(res.status===401)logout();const data=await res.json();tbody.innerHTML=(data.usuarios||[]).map(u=>`<tr><td>${u.username}</td><td>${u.nombre||''}</td><td><span class="badge">${roleLabel(u.role)}</span></td><td><select onchange="cambiarRol('${u.username}',this.value)"><option value="guardia" ${u.role==='guardia'?'selected':''}>Guardia</option><option value="ingeniero" ${u.role==='ingeniero'?'selected':''}>Ingeniero</option><option value="super_admin" ${u.role==='super_admin'?'selected':''}>Super Admin</option></select> <button class="btn danger" onclick="eliminarUsuario('${u.username}')">Eliminar</button></td></tr>`).join('')}async function crearUsuario(){const payload={username:username.value.trim(),nombre:nombre.value.trim(),password:password.value,role:role.value};const res=await fetch(`${SERVER}/api/usuarios`,{method:'POST',headers:jsonHeaders(),body:JSON.stringify(payload)});const data=await res.json().catch(()=>({}));msg.textContent=res.ok?'Usuario creado':(data.detail||'Error');if(res.ok){username.value=nombre.value=password.value='';cargar()}}async function cambiarRol(user,role){const res=await fetch(`${SERVER}/api/usuarios/${encodeURIComponent(user)}/role`,{method:'PATCH',headers:jsonHeaders(),body:JSON.stringify({role})});if(!res.ok)alert('No se pudo cambiar rol');cargar()}async function eliminarUsuario(user){if(user==='admin'){alert('No se puede eliminar admin');return}if(!confirm(`¿Eliminar ${user}?`))return;const res=await fetch(`${SERVER}/api/usuarios/${encodeURIComponent(user)}`,{method:'DELETE',headers:headers()});if(!res.ok)alert('No se pudo eliminar');cargar()}cargar()</script></body></html>
