<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario TI - Usuarios</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#080a0e;--panel:#0d1117;--panel2:#131920;--border:rgba(99,179,237,.08);--border2:rgba(99,179,237,.18);--text:#cdd9e5;--text2:#768390;--text3:#3d4852;--green:#3fb950;--green-bg:#0a2416;--green-t:#56d364;--red:#f85149;--red-bg:#2a0a0a;--red-t:#ff7b72;--blue:#388bfd;--blue-bg:#031d3a;--blue-t:#79c0ff;--cyan:#39c5cf;--accent:#388bfd}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(56,139,253,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(56,139,253,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}body:after{content:'';position:fixed;top:0;left:0;right:0;height:300px;background:radial-gradient(ellipse 80% 200px at 50% -50px,rgba(56,139,253,.1),transparent);pointer-events:none;z-index:0}header{padding:0 2rem;height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;background:rgba(8,10,14,.92);backdrop-filter:blur(12px);z-index:100}.logo{display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);white-space:nowrap}.logo-pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:glow 2s ease-in-out infinite}@keyframes glow{0%,100%{opacity:1;box-shadow:0 0 8px var(--green)}50%{opacity:.4;box-shadow:0 0 2px var(--green)}}.title-block h1{font-family:'Space Mono',monospace;font-size:.9rem;letter-spacing:.08em;font-weight:700;text-transform:uppercase;color:var(--text)}.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.nav a,.nav button,.btn{border:1px solid var(--border2);background:transparent;color:var(--text2);padding:7px 12px;border-radius:6px;text-decoration:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.78rem;transition:all .15s}.nav a:hover,.nav button:hover,.btn:hover{background:var(--panel2);color:var(--text);border-color:rgba(99,179,237,.28)}.nav a.active{background:var(--blue-bg);border-color:rgba(56,139,253,.35);color:var(--blue-t)}.nav button:hover,.danger:hover{background:var(--red-bg)!important;color:var(--red-t)!important;border-color:rgba(248,81,73,.3)!important}main{position:relative;z-index:1;padding:1.5rem 2rem;max-width:1500px;margin:0 auto}.page-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:1.5rem}.eyebrow{font-family:'Space Mono',monospace;color:var(--text3);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}.page-hero h2{font-family:'Space Mono',monospace;font-size:1.5rem;letter-spacing:.04em;color:var(--text)}.page-hero p,.muted,.hint{color:var(--text2);font-size:.82rem;line-height:1.45}.grid{display:grid;grid-template-columns:minmax(360px,440px) minmax(0,1fr);gap:18px;align-items:start}.stack{display:grid;gap:18px}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 8px 32px rgba(0,0,0,.3);position:relative;overflow:hidden}.card:before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(56,139,253,.35),transparent)}.card h2{font-family:'Space Mono',monospace;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;color:var(--text)}label{display:block;margin:10px 0 5px;color:var(--text3);font-family:'Space Mono',monospace;font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}input,select,textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);outline:none;font-family:'DM Sans',sans-serif}textarea{min-height:120px;resize:vertical;font-family:Consolas,monospace}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,139,253,.1)}.primary{background:var(--green-bg)!important;border-color:rgba(63,185,80,.3)!important;color:var(--green-t)!important}.danger{background:transparent!important;color:var(--red-t)!important}.toolbar{display:grid;grid-template-columns:1fr minmax(260px,420px);gap:14px;align-items:end;margin-bottom:14px}.tablewrap{max-width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:rgba(13,17,23,.55)}table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:1120px}th,td{padding:12px 10px;border-bottom:1px solid var(--border);text-align:left;font-size:.86rem;vertical-align:top;overflow-wrap:anywhere;word-break:break-word;line-height:1.35}th{color:var(--text3);font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;background:rgba(8,10,14,.55)}tbody tr:hover td{background:rgba(56,139,253,.04)}.badge,.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--blue-bg);color:var(--blue-t);font-family:'Space Mono',monospace;font-size:.66rem;white-space:normal}.ok{background:var(--green-bg);color:var(--green-t)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field-full{grid-column:1/-1}.csv-example{display:block;margin-top:8px;padding:10px;border:1px dashed var(--border2);border-radius:10px;color:var(--text2);font-family:Consolas,monospace;font-size:.72rem;overflow-wrap:anywhere}#msg,#bulkMsg{display:block;margin-top:10px;min-height:18px}@media(max-width:1100px){header{height:auto;padding:12px 1rem;align-items:flex-start;flex-direction:column}.grid,.toolbar{grid-template-columns:1fr}main{padding:1rem}.page-hero{display:block}.field-grid{grid-template-columns:1fr}.field-full{grid-column:auto}.tablewrap{margin-top:8px}}@media(max-width:520px){.nav a,.nav button,.btn{width:100%;text-align:center}.nav{width:100%}}
</style></head>
<body><header><div class="logo"><div class="logo-pulse"></div>Monitor - Usuarios</div><div class="title-block"><h1>Inventario TI</h1></div><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/equipos">Equipos</a><a href="/empleados">Empleados</a><a class="active" href="/usuarios">Usuarios</a><a href="/reset-password">Contrasena</a><button onclick="logout()">Salir</button></nav></header><main><section class="page-hero"><div><div class="eyebrow">Administracion de acceso</div><h2>Usuarios</h2><p>Crea usuarios internos y administra roles de acceso al monitor.</p></div></section><div class="grid"><section class="card"><h2>Crear usuario</h2><label>Usuario</label><input id="username" placeholder="usuario"><label>Nombre</label><input id="nombre" placeholder="Nombre completo"><label>Contrasena temporal</label><input id="password" type="password" placeholder="contrasena temporal"><label>Rol</label><select id="role"><option value="guardia">Guardia</option><option value="ingeniero">Ingeniero</option><option value="super_admin">Super Admin</option></select><button class="btn primary" onclick="crearUsuario()">Crear usuario</button><p class="muted" id="msg"></p></section><section class="card"><div class="toolbar"><div><h2>Usuarios activos</h2><div class="muted">Control de cuentas y permisos.</div></div></div><div class="tablewrap"><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Acciones</th></tr></thead><tbody id="tbody"></tbody></table></div></section></div></main><script>const SERVER=location.origin,TOKEN=localStorage.getItem('monitor_token'),ROLE=localStorage.getItem('monitor_role');if(!TOKEN)location.href='/login';if(ROLE!=='super_admin')location.href='/dashboard';function headers(){return{Authorization:`Bearer ${TOKEN}`}}function jsonHeaders(){return{...headers(),'Content-Type':'application/json'}}function logout(){localStorage.clear();location.href='/login'}function roleLabel(r){return r==='super_admin'?'Super Admin':r==='guardia'?'Guardia':'Ingeniero'}async function cargar(){const res=await fetch(`${SERVER}/api/usuarios`,{headers:headers()});if(res.status===401)logout();const data=await res.json();tbody.innerHTML=(data.usuarios||[]).map(u=>`<tr><td>${u.username}</td><td>${u.nombre||''}</td><td><span class="badge">${roleLabel(u.role)}</span></td><td><select onchange="cambiarRol('${u.username}',this.value)"><option value="guardia" ${u.role==='guardia'?'selected':''}>Guardia</option><option value="ingeniero" ${u.role==='ingeniero'?'selected':''}>Ingeniero</option><option value="super_admin" ${u.role==='super_admin'?'selected':''}>Super Admin</option></select> <button class="btn danger" onclick="eliminarUsuario('${u.username}')">Eliminar</button></td></tr>`).join('')}async function crearUsuario(){const payload={username:username.value.trim(),nombre:nombre.value.trim(),password:password.value,role:role.value};const res=await fetch(`${SERVER}/api/usuarios`,{method:'POST',headers:jsonHeaders(),body:JSON.stringify(payload)});const data=await res.json().catch(()=>({}));msg.textContent=res.ok?'Usuario creado':(data.detail||'Error');if(res.ok){username.value=nombre.value=password.value='';cargar()}}async function cambiarRol(user,role){const res=await fetch(`${SERVER}/api/usuarios/${encodeURIComponent(user)}/role`,{method:'PATCH',headers:jsonHeaders(),body:JSON.stringify({role})});if(!res.ok)alert('No se pudo cambiar rol');cargar()}async function eliminarUsuario(user){if(user==='admin'){alert('No se puede eliminar admin');return}if(!confirm(`¿Eliminar ${user}?`))return;const res=await fetch(`${SERVER}/api/usuarios/${encodeURIComponent(user)}`,{method:'DELETE',headers:headers()});if(!res.ok)alert('No se pudo eliminar');cargar()}cargar()</script></body></html>
