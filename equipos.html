<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario Firebase</title>
  <style>
    :root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#f0f6fc;--muted:#8b949e;--blue:#58a6ff;--green:#238636;--red:#da3633}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--border);background:#010409}.brand{font-weight:800}.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.nav a,.nav button,.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 12px;border-radius:10px;text-decoration:none;cursor:pointer}.nav a.active{border-color:var(--blue)}main{padding:24px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.stack{display:grid;gap:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}label{display:block;margin:10px 0 5px;color:var(--muted);font-size:.75rem;font-weight:700;text-transform:uppercase}input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:#0d1117;color:var(--text)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;font-size:.88rem;vertical-align:top}th{color:var(--muted);font-size:.72rem;text-transform:uppercase}.muted{color:var(--muted);font-size:.78rem}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tab{border:1px solid var(--border);background:#0d1117;color:var(--text);padding:8px 10px;border-radius:999px;cursor:pointer}.tab.active{border-color:var(--blue);color:#79c0ff}.primary{background:var(--green)!important;color:white!important}.danger{background:var(--red)!important;color:white!important}.inline{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#1f6feb33;color:#79c0ff;font-size:.75rem}@media(max-width:980px){.grid{grid-template-columns:1fr}table{min-width:980px}.tablewrap{overflow:auto}.inline{grid-template-columns:1fr}}
  </style>
  <style>
    .tablewrap { max-width: 100%; overflow-x: auto; }
    table { table-layout: fixed; min-width: 1180px; }
    th, td { overflow-wrap: anywhere; word-break: break-word; line-height: 1.35; }
    td:nth-child(1) { width: 240px; }
    td:nth-child(2) { width: 110px; }
    td:nth-child(3) { width: 220px; }
    td:nth-child(4) { width: 420px; }
    td:nth-child(5) { width: 190px; }
    .inline { grid-template-columns: minmax(180px,1.4fr) minmax(120px,1fr) minmax(120px,1fr); }
    .pill { white-space: normal; }
    .btn { white-space: nowrap; margin: 2px 0; }
    .grid { grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
    .assets-card { padding: 20px; }
    .assets-header { display: grid; grid-template-columns: 1fr minmax(260px, 420px); gap: 14px; align-items: end; margin-bottom: 14px; }
    .assets-header h2 { margin: 0 0 4px; font-size: 1.25rem; }
    .assets-header .muted { line-height: 1.35; }
    .assets-search label { margin-top: 0; }
    .tabs { margin: 0 0 14px; padding-bottom: 2px; }
    .tab { box-shadow: inset 0 0 0 1px rgba(255,255,255,.02); }
    .tab.active { background: #10223a; }
    .tablewrap { border: 1px solid var(--border); border-radius: 14px; }
    thead tr { background: rgba(13,17,23,.86); }
    tbody tr:hover td { background: rgba(88,166,255,.05); }
    @media(max-width:980px){.assets-header{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="brand">Inventario Firebase</div><nav class="nav"><a href="/dashboard">Dashboard sensores</a><a class="active" href="/equipos">Equipos</a><a href="/empleados">Empleados</a><a href="/usuarios">Usuarios</a><button onclick="logout()">Salir</button></nav></header>
<main>
  <div class="grid">
    <div class="stack">
      <section class="card">
        <h2 id="assetFormTitle">Agregar asset</h2><input id="editAssetId" type="hidden" />
        <label>Tipo</label><select id="tipo"><option>Laptop</option><option>Desktop</option><option>Monitor</option><option>Impresora</option><option>Impresora de tickets</option><option>Red</option><option>Cargador</option><option>Dock</option><option>Mouse</option><option>Teclado</option><option>Otro</option></select><label>Subtipo</label><input id="subtipo" placeholder="Ej. tickets, red, perif?rico" />
        <label>No. inventario</label><input id="numInventario" />
        <label>Serie</label><input id="serie" />
        <label>Marca</label><input id="marca" />
        <label>Modelo</label><input id="modelo" /><label>Fecha compra</label><input id="fechaCompra" placeholder="2025-05-14" /><label>Notas</label><input id="notas" placeholder="Observaciones" />
        <label>Asignado a</label><select id="asignado" onchange="autocompletarAsset()"><option value="">Sin asignar</option></select>
        <label>Departamento</label><input id="departamento" />
        <label>Puesto</label><input id="puesto" />
        <button class="btn primary" onclick="guardarAsset()">Guardar asset</button> <button class="btn" onclick="limpiarAssetForm()">Nuevo</button><div class="muted" id="msg"></div>
      </section>
    </div>
    <section class="card assets-card">
      <div class="assets-header">
        <div>
          <h2>Assets por tipo</h2>
          <div class="muted">Consulta, filtra y reasigna los activos guardados en Firebase.</div>
        </div>
        <div class="assets-search">
          <label>Buscar</label>
          <input id="q" placeholder="Serie, inventario, asignado..." oninput="render()" />
        </div>
      </div>
      <div id="tabs" class="tabs"></div>
      <div class="tablewrap"><table><thead><tr><th>Asset</th><th>Tipo</th><th>Asignación</th><th>Reasignar</th><th>Acciones</th></tr></thead><tbody id="tbody"></tbody></table></div>
    </section>
  </div>
</main>
<script>
const SERVER=window.location.origin;let TOKEN=localStorage.getItem('monitor_token');let ROLE=localStorage.getItem('monitor_role')||'ingeniero';let assets=[],empleados=[],tipoActual='Todos';if(!TOKEN)location.href='/login';
function headers(){return {'Authorization':`Bearer ${TOKEN}`}}function jsonHeaders(){return {...headers(),'Content-Type':'application/json'}}function logout(){localStorage.clear();location.href='/login'}function esc(v){return String(v||'').replace(/"/g,'&quot;')}function empByName(n){return empleados.find(e=>e.nombreCompleto===n)}
async function cargar(){const [resAssets,resEmps]=await Promise.all([fetch(`${SERVER}/api/assets`,{headers:headers()}),fetch(`${SERVER}/api/empleados`,{headers:headers()})]);if(resAssets.status===401){logout();return}if(!resAssets.ok){const err=await resAssets.json().catch(()=>({}));tbody.innerHTML=`<tr><td colspan="5">No se pudo cargar inventario: ${esc(err.detail||resAssets.status)}</td></tr>`;return}const data=await resAssets.json();const empData=resEmps.ok?await resEmps.json():{empleados:[]};assets=data.assets||[];empleados=(empData.empleados||[]).filter(e=>e.activo!==false);llenarEmpleados();renderTabs();render();if((data.omitidos||[]).length){msg.textContent=`Se omitieron ${data.omitidos.length} assets con datos inv?lidos.`}}
function llenarEmpleados(){const opts='<option value="">Sin asignar</option>'+empleados.map(e=>`<option value="${esc(e.nombreCompleto)}">${e.nombreCompleto} · ${e.departamento||''} · ${e.puesto||''}</option>`).join('');asignado.innerHTML=opts}
function empleadoOptions(actual){return '<option value="">Sin asignar</option>'+empleados.map(e=>`<option value="${esc(e.nombreCompleto)}" ${e.nombreCompleto===actual?'selected':''}>${e.nombreCompleto} · ${e.departamento||''} · ${e.puesto||''}</option>`).join('')}
function autocompletarAsset(){const e=empByName(asignado.value);departamento.value=e?e.departamento||'':'';puesto.value=e?e.puesto||'':''}
function aplicarEmpleado(id){const e=empByName(document.getElementById(`asig-${id}`).value);if(e){document.getElementById(`dep-${id}`).value=e.departamento||'';document.getElementById(`pto-${id}`).value=e.puesto||''}else{document.getElementById(`dep-${id}`).value='';document.getElementById(`pto-${id}`).value=''}}
function tipos(){return ['Todos',...Array.from(new Set(assets.map(a=>a.tipo||'Otro'))).sort()]}function renderTabs(){tabs.innerHTML=tipos().map(t=>`<button class="tab ${t===tipoActual?'active':''}" onclick="tipoActual='${t}';renderTabs();render()">${t}</button>`).join('')}
function render(){const term=(q.value||'').toLowerCase();let rows=assets.filter(a=>tipoActual==='Todos'||(a.tipo||'Otro')===tipoActual).filter(a=>JSON.stringify(a).toLowerCase().includes(term));tbody.innerHTML=rows.map(a=>`<tr><td><strong>${a.numInventario||'Sin inventario'}</strong><div class="muted">Serie: ${a.serie||'—'} · ${a.marca||''} ${a.modelo||''}</div></td><td><span class="pill">${a.tipo||'Otro'}</span></td><td>${a.asignado||'<span class="muted">Sin asignar</span>'}<div class="muted">${a.departamento||''} ${a.puesto?`· ${a.puesto}`:''}</div></td><td><div class="inline"><select id="asig-${a.id}" onchange="aplicarEmpleado('${a.id}')">${empleadoOptions(a.asignado)}</select><input id="dep-${a.id}" placeholder="Depto" value="${esc(a.departamento)}"><input id="pto-${a.id}" placeholder="Puesto" value="${esc(a.puesto)}"></div></td><td><button class="btn" onclick="editarAsset('${a.id}')">Editar</button> <button class="btn primary" onclick="asignar('${a.id}')">Guardar</button> <button class="btn" onclick="desasignar('${a.id}')">Desasignar</button> <button class="btn danger" onclick="eliminar('${a.id}')">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="5">Sin assets</td></tr>'}
function assetPayload(){return{tipo:tipo.value,numInventario:numInventario.value.trim(),serie:serie.value.trim(),subtipo:subtipo.value.trim(),marca:marca.value.trim(),modelo:modelo.value.trim(),fechaCompra:fechaCompra.value.trim(),notas:notas.value.trim(),asignado:asignado.value.trim(),departamento:departamento.value.trim(),puesto:puesto.value.trim()}}function limpiarAssetForm(){assetFormTitle.textContent='Agregar asset';editAssetId.value='';['numInventario','serie','subtipo','marca','modelo','fechaCompra','notas','departamento','puesto'].forEach(id=>window[id].value='');asignado.value='';msg.textContent=''}function editarAsset(id){const a=assets.find(x=>x.id===id);if(!a)return;assetFormTitle.textContent='Editar asset';editAssetId.value=a.id;if([...tipo.options].some(o=>o.value===a.tipo)){tipo.value=a.tipo}else{tipo.value='Otro'}subtipo.value=a.subtipo||'';numInventario.value=a.numInventario||'';serie.value=a.serie||'';marca.value=a.marca||'';modelo.value=a.modelo||'';fechaCompra.value=a.fechaCompra||'';notas.value=a.notas||'';asignado.value=a.asignado||'';departamento.value=a.departamento||'';puesto.value=a.puesto||'';window.scrollTo({top:0,behavior:'smooth'})}async function guardarAsset(){const payload=assetPayload();if(!payload.serie&&!payload.numInventario){alert('Captura serie o n?mero de inventario');return}const id=editAssetId.value;const res=await fetch(id?`${SERVER}/api/assets/${encodeURIComponent(id)}`:`${SERVER}/api/assets`,{method:id?'PATCH':'POST',headers:jsonHeaders(),body:JSON.stringify(payload)});const err=await res.json().catch(()=>({}));msg.textContent=res.ok?'Guardado en Firebase':(err.detail||'No se pudo guardar');if(res.ok){limpiarAssetForm();cargar()}}async function asignar(id){const payload={asignado:document.getElementById(`asig-${id}`).value.trim(),departamento:document.getElementById(`dep-${id}`).value.trim(),puesto:document.getElementById(`pto-${id}`).value.trim()};const res=await fetch(`${SERVER}/api/assets/${encodeURIComponent(id)}/asignacion`,{method:'PATCH',headers:jsonHeaders(),body:JSON.stringify(payload)});if(!res.ok)alert('No se pudo asignar');cargar()}async function desasignar(id){if(!confirm('¿Desasignar este asset?'))return;const res=await fetch(`${SERVER}/api/assets/${encodeURIComponent(id)}/asignacion`,{method:'PATCH',headers:jsonHeaders(),body:JSON.stringify({asignado:'',departamento:'',puesto:''})});if(!res.ok)alert('No se pudo desasignar');cargar()}async function eliminar(id){if(!confirm('¿Eliminar asset de Firebase?'))return;const res=await fetch(`${SERVER}/api/assets/${encodeURIComponent(id)}`,{method:'DELETE',headers:headers()});if(!res.ok)alert('No se pudo eliminar');cargar()}cargar();
</script></body></html>
