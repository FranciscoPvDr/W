<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario Firebase</title>
  <style>
    :root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#f0f6fc;--muted:#8b949e;--blue:#58a6ff;--green:#238636;--red:#da3633}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--border);background:#010409}.brand{font-weight:800}.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.nav a,.nav button,.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 12px;border-radius:10px;text-decoration:none;cursor:pointer}.nav a.active{border-color:var(--blue)}main{padding:24px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.stack{display:grid;gap:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}label{display:block;margin:10px 0 5px;color:var(--muted);font-size:.75rem;font-weight:700;text-transform:uppercase}input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:#0d1117;color:var(--text)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;font-size:.88rem;vertical-align:top}th{color:var(--muted);font-size:.72rem;text-transform:uppercase}.muted{color:var(--muted);font-size:.78rem}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tab{border:1px solid var(--border);background:#0d1117;color:var(--text);padding:8px 10px;border-radius:999px;cursor:pointer}.tab.active{border-color:var(--blue);color:#79c0ff}.primary{background:var(--green)!important;color:white!important}.danger{background:var(--red)!important;color:white!important}.inline{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#1f6feb33;color:#79c0ff;font-size:.75rem}@media(max-width:980px){.grid{grid-template-columns:1fr}table{min-width:980px}.tablewrap{overflow:auto}.inline{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="brand">Inventario Firebase</div><nav class="nav"><a href="/dashboard">Dashboard sensores</a><a class="active" href="/equipos">Equipos</a><a href="/empleados">Empleados</a><a href="/usuarios">Usuarios</a><button onclick="logout()">Salir</button></nav></header>
<main>
  <div class="grid">
    <div class="stack">
      <section class="card">
        <h2>Agregar asset</h2>
        <label>Tipo</label><select id="tipo"><option>Laptop</option><option>Desktop</option><option>Monitor</option><option>Cargador</option><option>Dock</option><option>Mouse</option><option>Teclado</option><option>Impresora</option><option>Otro</option></select>
        <label>No. inventario</label><input id="numInventario" />
        <label>Serie</label><input id="serie" />
        <label>Marca</label><input id="marca" />
        <label>Modelo</label><input id="modelo" />
        <label>Asignado a</label><select id="asignado" onchange="autocompletarAsset()"><option value="">Sin asignar</option></select>
        <label>Departamento</label><input id="departamento" />
        <label>Puesto</label><input id="puesto" />
        <button class="btn primary" onclick="crearAsset()">Guardar asset</button><div class="muted" id="msg"></div>
      </section>
      <section class="card">
        <h2>Agregar empleado</h2>
        <label>No. empleado</label><input id="empNum" placeholder="A-00011" />
        <label>Nombre</label><input id="empNombre" />
        <label>Apellido paterno</label><input id="empPaterno" />
        <label>Apellido materno</label><input id="empMaterno" />
        <label>Departamento</label><input id="empDepto" />
        <label>Puesto</label><input id="empPuesto" />
        <label>Correo</label><input id="empCorreo" />
        <label>Teléfono</label><input id="empTelefono" />
        <label>Fecha ingreso</label><input id="empIngreso" placeholder="06/01/2025" />
        <button class="btn primary" onclick="crearEmpleado()">Guardar empleado</button><div class="muted" id="empMsg"></div>
      </section>
    </div>
    <section class="card">
      <div class="toolbar"><h2>Assets por tipo</h2><input id="q" placeholder="Buscar por serie, inventario, asignado..." oninput="render()" /></div>
      <div id="tabs" class="tabs"></div>
      <div class="tablewrap"><table><thead><tr><th>Asset</th><th>Tipo</th><th>Asignación</th><th>Reasignar</th><th>Acciones</th></tr></thead><tbody id="tbody"></tbody></table></div>
    </section>
  </div>
</main>
<script>
const SERVER=window.location.origin;let TOKEN=localStorage.getItem('monitor_token');let ROLE=localStorage.getItem('monitor_role')||'ingeniero';let assets=[],empleados=[],tipoActual='Todos';if(!TOKEN)location.href='/login';
function headers(){return {'Authorization':`Bearer ${TOKEN}`}}function jsonHeaders(){return {...headers(),'Content-Type':'application/json'}}function logout(){localStorage.clear();location.href='/login'}function esc(v){return String(v||'').replace(/"/g,'&quot;')}function empByName(n){return empleados.find(e=>e.nombreCompleto===n)}
async function cargar(){const [resAssets,resEmps]=await Promise.all([fetch(`${SERVER}/api/assets`,{headers:headers()}),fetch(`${SERVER}/api/empleados`,{headers:headers()})]);if(resAssets.status===401){logout();return}if(!resAssets.ok){tbody.innerHTML='<tr><td colspan="5">No se pudo cargar inventario</td></tr>';return}const data=await resAssets.json();const empData=resEmps.ok?await resEmps.json():{empleados:[]};assets=data.assets||[];empleados=(empData.empleados||[]).filter(e=>e.activo!==false);llenarEmpleados();renderTabs();render()}
function llenarEmpleados(){const opts='<option value="">Sin asignar</option>'+empleados.map(e=>`<option value="${esc(e.nombreCompleto)}">${e.nombreCompleto} · ${e.departamento||''} · ${e.puesto||''}</option>`).join('');asignado.innerHTML=opts}
function empleadoOptions(actual){return '<option value="">Sin asignar</option>'+empleados.map(e=>`<option value="${esc(e.nombreCompleto)}" ${e.nombreCompleto===actual?'selected':''}>${e.nombreCompleto} · ${e.departamento||''} · ${e.puesto||''}</option>`).join('')}
function autocompletarAsset(){const e=empByName(asignado.value);departamento.value=e?e.departamento||'':'';puesto.value=e?e.puesto||'':''}
function aplicarEmpleado(id){const e=empByName(document.getElementById(`asig-${id}`).value);if(e){document.getElementById(`dep-${id}`).value=e.departamento||'';document.getElementById(`pto-${id}`).value=e.puesto||''}else{document.getElementById(`dep-${id}`).value='';document.getElementById(`pto-${id}`).value=''}}
function tipos(){return ['Todos',...Array.from(new Set(assets.map(a=>a.tipo||'Otro'))).sort()]}function renderTabs(){tabs.innerHTML=tipos().map(t=>`<button class="tab ${t===tipoActual?'active':''}" onclick="tipoActual='${t}';renderTabs();render()">${t}</button>`).join('')}
function render(){const term=(q.value||'').toLowerCase();let rows=assets.filter(a=>tipoActual==='Todos'||(a.tipo||'Otro')===tipoActual).filter(a=>JSON.stringify(a).toLowerCase().includes(term));tbody.innerHTML=rows.map(a=>`<tr><td><strong>${a.numInventario||'Sin inventario'}</strong><div class="muted">Serie: ${a.serie||'—'} · ${a.marca||''} ${a.modelo||''}</div></td><td><span class="pill">${a.tipo||'Otro'}</span></td><td>${a.asignado||'<span class="muted">Sin asignar</span>'}<div class="muted">${a.departamento||''} ${a.puesto?`· ${a.puesto}`:''}</div></td><td><div class="inline"><select id="asig-${a.id}" onchange="aplicarEmpleado('${a.id}')">${empleadoOptions(a.asignado)}</select><input id="dep-${a.id}" placeholder="Depto" value="${esc(a.departamento)}"><input id="pto-${a.id}" placeholder="Puesto" value="${esc(a.puesto)}"></div></td><td><button class="btn primary" onclick="asignar('${a.id}')">Guardar</button> <button class="btn" onclick="desasignar('${a.id}')">Desasignar</button> <button class="btn danger" onclick="eliminar('${a.id}')">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="5">Sin assets</td></tr>'}
async function crearAsset(){const payload={tipo:tipo.value,numInventario:numInventario.value.trim(),serie:serie.value.trim(),marca:marca.value.trim(),modelo:modelo.value.trim(),asignado:asignado.value.trim(),departamento:departamento.value.trim(),puesto:puesto.value.trim()};if(!payload.serie&&!payload.numInventario){alert('Captura serie o número de inventario');return}const res=await fetch(`${SERVER}/api/assets`,{method:'POST',headers:jsonHeaders(),body:JSON.stringify(payload)});msg.textContent=res.ok?'Guardado en Firebase':'No se pudo guardar';if(res.ok){['numInventario','serie','marca','modelo','departamento','puesto'].forEach(id=>window[id].value='');asignado.value='';cargar()}}
async function crearEmpleado(){const payload={numEmpleado:empNum.value.trim(),nombre:empNombre.value.trim(),apellidoPaterno:empPaterno.value.trim(),apellidoMaterno:empMaterno.value.trim(),correo:empCorreo.value.trim(),departamento:empDepto.value.trim(),puesto:empPuesto.value.trim(),telefono:empTelefono.value.trim(),fechaIngreso:empIngreso.value.trim(),activo:true};if(!payload.nombre){alert('Captura nombre');return}const res=await fetch(`${SERVER}/api/empleados`,{method:'POST',headers:jsonHeaders(),body:JSON.stringify(payload)});empMsg.textContent=res.ok?'Empleado guardado':'No se pudo guardar empleado';if(res.ok){['empNum','empNombre','empPaterno','empMaterno','empCorreo','empDepto','empPuesto','empTelefono','empIngreso'].forEach(id=>window[id].value='');cargar()}}
async function asignar(id){const payload={asignado:document.getElementById(`asig-${id}`).value.trim(),departamento:document.getElementById(`dep-${id}`).value.trim(),puesto:document.getElementById(`pto-${id}`).value.trim()};const res=await fetch(`${SERVER}/api/assets/${encodeURIComponent(id)}/asignacion`,{method:'PATCH',headers:jsonHeaders(),body:JSON.stringify(payload)});if(!res.ok)alert('No se pudo asignar');cargar()}async function desasignar(id){if(!confirm('¿Desasignar este asset?'))return;const res=await fetch(`${SERVER}/api/assets/${encodeURIComponent(id)}/asignacion`,{method:'PATCH',headers:jsonHeaders(),body:JSON.stringify({asignado:'',departamento:'',puesto:''})});if(!res.ok)alert('No se pudo desasignar');cargar()}async function eliminar(id){if(!confirm('¿Eliminar asset de Firebase?'))return;const res=await fetch(`${SERVER}/api/assets/${encodeURIComponent(id)}`,{method:'DELETE',headers:headers()});if(!res.ok)alert('No se pudo eliminar');cargar()}cargar();
</script></body></html>
