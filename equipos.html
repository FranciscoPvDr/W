<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipos · Monitor</title>
  <style>
    :root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#f0f6fc;--muted:#8b949e;--blue:#58a6ff;--green:#238636;--red:#da3633;--yellow:#d29922}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--border);background:#010409}.brand{font-weight:800}.nav{display:flex;gap:10px;align-items:center}.nav a,.nav button,.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 12px;border-radius:10px;text-decoration:none;cursor:pointer}.nav a.active{border-color:var(--blue)}main{padding:24px;max-width:1300px;margin:auto}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1080px}th,td{padding:11px;border-bottom:1px solid var(--border);text-align:left;font-size:.88rem;vertical-align:top}th{color:var(--muted);font-size:.74rem;text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:.75rem;margin:1px}.ok{background:#23863633;color:#7ee787}.bad{background:#da363333;color:#ff7b72}.warn{background:#d2992233;color:#f2cc60}.muted{color:var(--muted);font-size:.8rem}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px;align-items:center}input{padding:10px;border-radius:10px;border:1px solid var(--border);background:#0d1117;color:var(--text);min-width:260px}.danger{background:var(--red)!important;color:white!important}.primary{background:var(--green)!important;color:white!important}.warning{background:var(--yellow)!important;color:#111!important}.stack{display:flex;gap:6px;flex-wrap:wrap}.notice{border:1px solid #d2992266;background:#d299221a;border-radius:12px;padding:12px;margin-bottom:14px;color:#f2cc60}@media(max-width:850px){header{flex-direction:column;gap:12px;align-items:flex-start}.nav{flex-wrap:wrap}.toolbar{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
<header><div class="brand">Monitor · Equipos</div><nav class="nav"><a href="/dashboard">Dashboard</a><a class="active" href="/equipos">Equipos</a><a id="usuarios-link" href="/usuarios">Usuarios</a><a href="/guardia">Guardia</a><button onclick="logout()">Salir</button></nav></header>
<main>
  <section class="card">
    <div class="toolbar"><h2>Equipos registrados</h2><input id="q" placeholder="Buscar por equipo, serie, usuario..." oninput="render()" /></div>
    <div id="notice" class="notice" style="display:none"></div>
    <table><thead><tr><th>Equipo</th><th>Serie</th><th>Inventario</th><th>Asignado</th><th>IP</th><th>Red</th><th>Estado</th><th>USB</th><th>Último ping</th><th>Acciones</th></tr></thead><tbody id="tbody"></tbody></table>
  </section>
</main>
<script>
const SERVER=window.location.origin;let TOKEN=localStorage.getItem('monitor_token');let ROLE=localStorage.getItem('monitor_role')||'ingeniero';let equipos=[];
if(!TOKEN)location.href='/login'; if(ROLE==='guardia')location.href='/guardia'; if(ROLE!=='super_admin')document.getElementById('usuarios-link').style.display='none';
function headers(){return {'Authorization':`Bearer ${TOKEN}`}} function jsonHeaders(){return {...headers(),'Content-Type':'application/json'}}
function logout(){localStorage.clear();location.href='/login'} function fmt(t){return t?new Date(t+(t.endsWith('Z')?'':'Z')).toLocaleString('es-MX'):'—'}
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function usb(e){const s=e.usb_storage_blocked===true?'Bloqueado':e.usb_storage_blocked===false?'Permitido':'Sin dato';const cls=e.usb_storage_blocked?'bad':'ok';const p=e.usb_storage_policy===true?'política: bloquear':e.usb_storage_policy===false?'política: habilitar':'';return `<span class="badge ${cls}">${s}</span><div class="muted">${esc(p)}</div><div class="muted">${esc(e.usb_block_error)}</div>`}
function inv(e){return e.inventariado?`<span class="badge ok">Inventario oficial</span><div class="muted">${esc(e.numInventario)||'Sin número'}</div>`:`<span class="badge warn">No inventariado</span><div class="muted">Detectado por sensor</div>`}
function actions(e){if(ROLE!=='super_admin')return '—';const block=e.usb_storage_policy!==true;let html=`<div class="stack"><button class="btn primary" onclick="usbPolicy('${e.device_id}',${block})">${block?'Bloquear USB':'Habilitar USB'}</button>`;if(!e.inventariado)html+=`<button class="btn warning" onclick="registrar('${e.device_id}')">Registrar laptop</button>`;html+=`<button class="btn danger" onclick="delEquipo('${e.device_id}',${!e.inventariado})">${e.inventariado?'Eliminar':'Eliminar prueba'}</button></div>`;return html}
async function cargar(){const res=await fetch(`${SERVER}/api/equipos`,{headers:headers()});if(res.status===401){logout();return}const data=await res.json();equipos=data.equipos||[];render()}
function render(){const term=(q.value||'').toLowerCase();const rows=equipos.filter(e=>JSON.stringify(e).toLowerCase().includes(term));const noInv=equipos.filter(e=>!e.inventariado).length;notice.style.display=noInv?'block':'none';notice.textContent=noInv?`Hay ${noInv} equipo(s) detectados por sensor que no están en inventario oficial. Puedes registrarlos o eliminarlos si fueron pruebas.`:'';tbody.innerHTML=rows.map(e=>`<tr><td>${esc(e.hostname)||'—'}<div class="muted">${esc((e.device_id||'').slice(0,8))}</div></td><td>${esc(e.serial_number)||'—'}</td><td>${inv(e)}</td><td>${esc(e.asignado)||'—'}</td><td>${esc(e.ip)||'—'}</td><td>${esc(e.ssid)||'—'}</td><td><span class="badge ${e.online?'ok':'bad'}">${e.online?'online':'offline'}</span> <span class="badge ${e.dentro?'ok':'bad'}">${e.dentro?'dentro':'fuera'}</span></td><td>${usb(e)}</td><td>${fmt(e.ultimo_ping)}</td><td>${actions(e)}</td></tr>`).join('')||'<tr><td colspan="10">Sin equipos</td></tr>'}
async function usbPolicy(id,block_usb_storage){if(!confirm(`¿${block_usb_storage?'Bloquear':'Habilitar'} USB en este equipo?`))return;const res=await fetch(`${SERVER}/api/equipos/${id}/usb-policy`,{method:'PATCH',headers:jsonHeaders(),body:JSON.stringify({block_usb_storage})});if(!res.ok)alert('No se pudo actualizar USB');cargar()}
async function registrar(id){const numInventario=prompt('Número de inventario de la laptop:')||'';const asignado=prompt('Asignado a:')||'';const departamento=prompt('Departamento:')||'';const puesto=prompt('Puesto:')||'';const res=await fetch(`${SERVER}/api/equipos/${id}/registrar`,{method:'POST',headers:jsonHeaders(),body:JSON.stringify({numInventario,asignado,departamento,puesto})});if(!res.ok)alert('No se pudo registrar la laptop');cargar()}
async function delEquipo(id,prueba){const msg=prueba?'¿Eliminar dispositivo de prueba? Se borrará del backend y Firebase.':'¿Eliminar equipo? Se borrará del backend y Firebase.';if(!confirm(msg))return;const res=await fetch(`${SERVER}/api/equipos/${id}`,{method:'DELETE',headers:headers()});if(!res.ok)alert('No se pudo eliminar');cargar()}
cargar();setInterval(cargar,30000);
</script>
</body>
</html>
