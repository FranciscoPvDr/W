<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario TI - Nuevo Asset</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080a0e;--panel:#0d1117;--panel2:#131920;--panel-glass:rgba(13,17,23,0.7);--border:rgba(99,179,237,.08);--border2:rgba(99,179,237,.18);--text:#cdd9e5;--text2:#768390;--text3:#3d4852;--green:#3fb950;--green-bg:#0a2416;--green-t:#56d364;--red:#f85149;--red-bg:#2a0a0a;--red-t:#ff7b72;--blue:#388bfd;--blue-bg:#031d3a;--blue-t:#79c0ff;--cyan:#39c5cf;--purple:#a371f7;--amber:#d29922;--amber-bg:#2a2012;--amber-t:#f2cc60;--accent:#388bfd;--shadow-sm:0 4px 16px rgba(0,0,0,0.2);--shadow-lg:0 12px 48px rgba(0,0,0,0.4)}
    *{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(56,139,253,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(56,139,253,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}body:after{content:'';position:fixed;top:0;left:0;right:0;height:300px;background:radial-gradient(ellipse 80% 200px at 50% -50px,rgba(56,139,253,.1),transparent);pointer-events:none;z-index:0}header{padding:0 2.5rem;min-height:80px;border-bottom:1px solid rgba(56,139,253,0.15);display:flex;align-items:center;justify-content:space-between;gap:3rem;position:sticky;top:0;background:rgba(6,8,17,0.85);backdrop-filter:blur(40px) saturate(180%);z-index:100;box-shadow:0 1px 0 0 rgba(99,179,237,0.12),0 20px 60px rgba(0,0,0,0.5),inset 0 1px 0 0 rgba(255,255,255,0.05)}.logo{font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-t)}.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn,.nav a,.nav button{border:1px solid rgba(99,179,237,.2);background:rgba(13,17,23,0.6);backdrop-filter:blur(10px);color:var(--text);padding:10px 16px;border-radius:8px;text-decoration:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.86rem;font-weight:600;transition:all .3s}.btn:hover,.nav a:hover,.nav button:hover{background:rgba(56,139,253,0.15);border-color:rgba(56,139,253,.35);box-shadow:0 4px 16px rgba(56,139,253,.25);transform:translateY(-2px)}.primary{background:rgba(10,36,22,0.8)!important;border-color:rgba(63,185,80,.35)!important;color:var(--green-t)!important}.primary:disabled,.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}main{position:relative;z-index:1;padding:28px 2.5rem 42px;max-width:1180px;margin:0 auto}.card{background:rgba(13,17,23,0.75);backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(99,179,237,.12);border-radius:16px;padding:24px;box-shadow:0 12px 48px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.03),inset 0 1px 0 0 rgba(255,255,255,.06);position:relative;overflow:hidden}.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(56,139,253,.5) 30%,rgba(163,113,247,.4) 70%,transparent);opacity:.8;pointer-events:none}.card > *{position:relative;z-index:1}.eyebrow,label,.step-chip{display:block;color:var(--text3);font-family:'Space Mono',monospace;font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1,h2{font-family:'Space Mono',monospace;letter-spacing:.08em;text-transform:uppercase}h1{font-size:1.65rem;margin:6px 0 8px}h2{font-size:.95rem;margin-bottom:14px;color:var(--blue-t)}.muted{color:var(--text2)}label{margin:14px 0 6px}input,select,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(99,179,237,.15);background:rgba(19,25,32,0.8);color:var(--text);outline:none;font-family:'DM Sans',sans-serif;font-size:.9rem;transition:all .3s}textarea{min-height:86px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:rgba(56,139,253,.5);box-shadow:0 0 0 4px rgba(56,139,253,.15)}.hero{margin-bottom:18px}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.progress-step{padding:12px;border:1px solid rgba(99,179,237,.14);border-radius:14px;background:rgba(19,25,32,.55);color:var(--text2)}.progress-step.active{border-color:rgba(56,139,253,.55);color:var(--blue-t);box-shadow:0 0 24px rgba(56,139,253,.16)}.progress-step.done{border-color:rgba(63,185,80,.35);color:var(--green-t)}.wizard-step{display:none}.wizard-step.active{display:block}.type-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.type-card{border:1px solid rgba(99,179,237,.14);background:rgba(19,25,32,.65);border-radius:16px;padding:18px;cursor:pointer;transition:all .3s;min-height:160px}.type-card:hover{border-color:rgba(56,139,253,.35);transform:translateY(-2px)}.type-card.selected{border-color:rgba(56,139,253,.8);box-shadow:0 0 0 1px rgba(56,139,253,.35),0 10px 32px rgba(56,139,253,.18)}.type-icon{font-size:2rem;margin-bottom:12px}.type-name{font-family:'Space Mono',monospace;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text);margin-bottom:8px}.type-desc{font-size:.86rem;color:var(--text2);line-height:1.35}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}.section-divider{margin-top:18px;padding-top:16px;border-top:1px solid rgba(99,179,237,.14)}.section-title{font-family:'Space Mono',monospace;font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}.empty-box{padding:24px;border:1px dashed rgba(99,179,237,.22);border-radius:14px;background:rgba(19,25,32,.45);text-align:center;color:var(--text2)}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.right-actions{display:flex;gap:10px}.error{color:var(--red-t);margin-top:12px;min-height:18px}.hint{font-size:.78rem;color:var(--text2);margin-top:6px}.search-wrap{position:relative}.employee-results{position:absolute;left:0;right:0;top:100%;z-index:20;border:1px solid rgba(99,179,237,.18);border-radius:12px;background:var(--panel2);box-shadow:0 16px 48px rgba(0,0,0,.45);max-height:260px;overflow:auto;display:none}.employee-option{padding:11px 12px;cursor:pointer;border-bottom:1px solid rgba(99,179,237,.08)}.employee-option:hover{background:rgba(56,139,253,.12)}@media(max-width:1100px){header{height:auto;padding:12px 1rem;align-items:flex-start;flex-direction:column}main{padding:1rem}.type-grid{grid-template-columns:repeat(2,1fr)}.progress{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.type-grid,.grid-2,.grid-3,.progress{grid-template-columns:1fr}.actions{flex-direction:column}.right-actions{flex-direction:column}.btn,.nav a,.nav button{width:100%;text-align:center}.nav{width:100%}h1{font-size:1.25rem}}
  </style>
</head>
<body>
<header>
  <div class="logo">Monitor · Nuevo asset</div>
  <nav class="nav"><a href="/equipos">← Regresar</a><button onclick="logout()"><i class="fas fa-right-from-bracket"></i> Salir</button></nav>
</header>
<main>
  <section class="hero">
    <div class="eyebrow">Wizard estilo InvGate</div>
    <h1>Alta de asset</h1>
    <p class="muted">Captura inventario, complementos y asignación en 4 pasos guiados.</p>
  </section>
  <section class="card">
    <div id="progress" class="progress"></div>
    <div id="step1" class="wizard-step active">
      <h2>Paso 1 · Tipo</h2>
      <div id="typeGrid" class="type-grid"></div>
    </div>
    <div id="step2" class="wizard-step">
      <h2>Paso 2 · Datos generales</h2>
      <div class="grid-2">
        <div><label>No. inventario</label><input id="numInventario" /></div>
        <div><label>Estado</label><select id="estado"><option>Activo</option><option>Disponible</option><option>En reparación</option><option>Fuera del parque</option></select></div>
        <div><label>Marca</label><input id="marca" /></div>
        <div><label>Modelo</label><input id="modelo" /></div>
        <div><label>Serie</label><input id="serie" /></div>
        <div><label>Fecha de compra</label><input id="fechaCompra" placeholder="2025-05-14" /></div>
      </div>
      <label>Notas</label><textarea id="notas" placeholder="Observaciones"></textarea>
      <div class="hint" id="inventarioHint"></div>
    </div>
    <div id="step3" class="wizard-step">
      <h2>Paso 3 · Complementos</h2>
      <div id="complementosStep"></div>
    </div>
    <div id="step4" class="wizard-step">
      <h2>Paso 4 · Asignación</h2>
      <label>Buscar empleado</label>
      <div class="search-wrap">
        <input id="empleadoSearch" placeholder="Nombre, departamento o puesto" autocomplete="off" />
        <div id="employeeResults" class="employee-results"></div>
      </div>
      <div class="form-actions" style="margin-top:10px"><button class="btn" type="button" onclick="sinAsignar()">Sin asignar</button></div>
      <div class="grid-2">
        <div><label>Asignado a</label><input id="asignado" readonly /></div>
        <div><label>Departamento</label><input id="departamento" readonly /></div>
        <div><label>Puesto</label><input id="puesto" readonly /></div>
      </div>
    </div>
    <div id="msg" class="error"></div>
    <div class="actions">
      <button class="btn" id="btnPrev" onclick="anterior()">Anterior</button>
      <div class="right-actions"><button class="btn" onclick="location.href='/equipos'">Cancelar</button><button class="btn primary" id="btnNext" onclick="siguiente()">Siguiente</button><button class="btn primary" id="btnSave" onclick="guardar()" style="display:none">Guardar</button></div>
    </div>
  </section>
</main>
<script src="/equipos-nuevo.js"></script>
<script src="/auth-session.js"></script>
</body>
</html>
