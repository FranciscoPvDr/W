<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardia</title><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#f0f6fc;--muted:#8b949e;--green:#238636;--red:#da3633}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial}header{display:flex;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--border);background:#010409}button{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 12px;border-radius:10px;cursor:pointer}main{padding:24px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left}.badge{padding:4px 8px;border-radius:999px}.ok{background:#23863633;color:#7ee787}.bad{background:#da363333;color:#ffb4ae}.muted{color:var(--muted)}</style></head><body><header><strong>Vista Guardia</strong><button onclick="logout()">Salir</button></header><main><section class="card"><h2>Equipos monitoreados</h2><table><thead><tr><th>Equipo</th><th>Serie</th><th>Estado</th><th>Último ping</th></tr></thead><tbody id="tbody"></tbody></table></section></main><script>const SERVER=location.origin,TOKEN=localStorage.getItem('monitor_token');if(!TOKEN)location.href='/login';function headers(){return{Authorization:`Bearer ${TOKEN}`}}function logout(){localStorage.clear();location.href='/login'}function fmt(t){return t?new Date(t+(t.endsWith('Z')?'':'Z')).toLocaleString('es-MX'):'—'}async function cargar(){const res=await fetch(`${SERVER}/api/equipos`,{headers:headers()});if(res.status===401)logout();const data=await res.json();tbody.innerHTML=(data.equipos||[]).map(e=>`<tr><td>${e.hostname||'—'}<div class="muted">${(e.device_id||'').slice(0,8)}</div></td><td>${e.serial_number||'—'}</td><td><span class="badge ${e.online?'ok':'bad'}">${e.online?'online':'offline'}</span> <span class="badge ${e.dentro?'ok':'bad'}">${e.dentro?'dentro':'fuera'}</span></td><td>${fmt(e.ultimo_ping)}</td></tr>`).join('')||'<tr><td colspan="4">Sin equipos</td></tr>'}cargar();setInterval(cargar,30000)</script></body></html>
